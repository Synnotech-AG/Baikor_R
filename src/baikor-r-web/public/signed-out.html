<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Baikor_R – Abgemeldet</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2a25;
        background: #f3f5f2;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        width: min(420px, 100%);
        padding: 36px;
        box-sizing: border-box;
        text-align: center;
        background: #ffffff;
        border: 1px solid #dfe5e1;
        border-radius: 12px;
        box-shadow: 0 14px 40px rgb(31 42 37 / 10%);
      }

      .mark {
        width: 48px;
        height: 5px;
        margin: 0 auto 28px;
        border-radius: 999px;
        background: #bfd730;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      p {
        margin: 0 0 28px;
        color: #617068;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        color: #172018;
        font-weight: 650;
        text-decoration: none;
        background: #c4dc2f;
        border: 1px solid #aec520;
        border-radius: 6px;
      }

      a:hover,
      a:focus-visible {
        background: #b9d127;
      }

      a:focus-visible {
        outline: 3px solid rgb(46 103 80 / 28%);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>Erfolgreich abgemeldet</h1>
      <p>Ihre Sitzung im Baustellenmanagement wurde beendet.</p>
      <a href="/">Erneut anmelden</a>
    </main>
  </body>
</html>
