name: Platform tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keycloak-accounts:
    name: Real Keycloak accounts and PostGIS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check smoke configuration safety
        run: python -m unittest discover -s tests/platform -p test_smoke_configuration.py
      - name: Run isolated HTTPS Keycloak smoke test
        run: python tests/platform/run_ci.py
      - name: Publish sanitized test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-test-results
          path: artifacts/platform-tests/summary.txt
          if-no-files-found: warn
          retention-days: 7
