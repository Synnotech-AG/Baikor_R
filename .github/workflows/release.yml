name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New stable application version (X.Y.Z, for example 1.7.6)'
        required: true
        type: string

permissions:
  contents: read

# Serialize publication across versions. Never cancel a run halfway through
# publishing; a failed run can safely resume at its original selected SHA.
concurrency:
  group: baikor-r-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate-release:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate version and selected branch
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/release/release.mjs validate

  checks:
    name: Required checks
    needs: validate-release
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish and verify release
    needs: [validate-release, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      HELM_CLI_IMAGE: alpine/helm:3.19.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Publish immutable artifacts, verify public downloads, and create release
        run: node scripts/release/release.mjs publish
