{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "baikor-r.fullname" . }}
  labels:
    {{- include "baikor-r.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "baikor-r.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: application
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
