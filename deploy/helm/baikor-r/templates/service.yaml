apiVersion: v1
kind: Service
metadata:
  name: {{ include "baikor-r.fullname" . }}
  labels:
    {{- include "baikor-r.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.telemetry.metrics.enabled }}
    - name: metrics
      port: {{ .Values.telemetry.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "baikor-r.selectorLabels" . | nindent 4 }}
