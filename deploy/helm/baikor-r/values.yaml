replicaCount: 1

image:
  repository: ghcr.io/synnotech-ag/baikor-r
  pullPolicy: IfNotPresent
  # An empty tag uses the chart's appVersion. CIVITAS deployments override it
  # through the add-on's software reference.
  tag: ""

imagePullSecrets: []
# Keep workload names stable while the OCI artifact uses a separate repository
# from the application image in the container registry.
nameOverride: "baikor-r"
fullnameOverride: ""

aspnetCore:
  environment: Production

authentication:
  caConfigMap: ""
  enabled: false
  authority: ""
  clientId: baikor-r
  clientSecret: ""
  existingSecret:
    name: ""
    key: clientSecret
  allowInvalidServerCertificate: false

dataProtection:
  keysPath: /var/lib/baikor-r/keys
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""

database:
  # Public CA bundle only; never mount the database server's private key.
  caConfigMap: ""
  connectionString: ""
  existingSecret:
    name: ""
    key: connectionString
  migrationExistingSecret:
    name: ""
    key: connectionString

migrations:
  enabled: true
  # Independent of the application's resources below; tune for schema/data size.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

networkPolicy:
  # Application pods only. Migration hooks are excluded; see docs/HELM_SECURITY.md.
  enabled: false
  # Native Kubernetes rules, with explicit peers and destination pod ports.
  # Enabling with empty lists denies both directions. No dependency is auto-allowed.
  ingress: []
  egress: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

telemetry:
  metrics:
    enabled: true
    port: 9464
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      additionalLabels: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: baikor-r.civitas.test
      paths:
        - path: /
          pathType: Prefix
  tls: []

podAnnotations: {}
# app.kubernetes.io/component is reserved as "application" for policy selection.
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1654
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
